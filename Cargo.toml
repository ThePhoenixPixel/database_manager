[package]
name = "database_manager"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.89"
chrono = "0.4.43"
address = { git = "https://github.com/ThePhoenixPixel/address.git", branch = "add-serde-support" }
serde = { version = "1.0.228", features = ["derive"] }

# Database dependencies (optional)
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-native-tls", "chrono"], optional = true }
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros"] }

# Derive macro (optional)
database_manager_derive = { path = "./database_manager_derive", optional = true }

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }

[features]
default = ["serde"]
serde = ["address/serde"]

# Derive macro feature
derive = ["database_manager_derive"]

# Database driver features
sqlite = ["sqlx", "sqlx/sqlite"]
mysql = ["sqlx", "sqlx/mysql"]
all-drivers = ["sqlite", "mysql"]

[[example]]
name = "sqlite_example"
required-features = ["sqlite"]

[[example]]
name = "mysql_example"
required-features = ["mysql"]

[[example]]
name = "derive_example"
required-features = ["sqlite", "derive"]